# Ger ut paketet som en packad tarboll på en GitHub-release, vid varje tagg.
#
# ══ ⛔ VARFÖR EN RELEASE-TILLGÅNG OCH INTE ETT REGISTRY ═════════════════
#
# Ärendet cllp/ops-framework#93 föreslog GitHub Packages eller Artifact
# Registry. Kravet i samma ärende är att `bolag-ops/functions` ska kunna
# installera paketet "utan GitHub-inloggning". Mätt 2026-09-25:
#
#   GitHub Packages, publikt paket @github/catalyst, utan token
#     -> HTTP 401 "authentication token not provided"
#
# Alltså faller det förslaget på ärendets eget krav. Artifact Registry har samma
# egenskap: läsning kräver ett Google-konto som Firebase byggcontainer inte har.
#
#   En release-tillgång i ett publikt repo, utan auth
#     -> HTTP 200
#
# ⛔ OCH INTE HELLER EN `github:`-BEROENDE. Repot är publikt sedan 2026-09-16, så
# den vägen kräver ingen inloggning heller. Men `dist/` är git-ignorerad, alltså
# skulle en sådan installation köra `prepare`, alltså esbuild och tsc, inne i
# byggcontainern. Mätt: `git ls-files dist` ger noll filer, medan den installerade
# kopian i appen har `dist/index.js`. En tarboll är färdigbyggd.
#
# ⛔ INGEN NY HEMLIGHET. Jobbet publicerar med `GITHUB_TOKEN`, som finns i varje
# körning. Ett registry hade krävt en token i Secret Manager, alltså en sak till
# som går ut och stoppar en deploy den dagen utan att någon minns varför. Samma
# skäl som står i `firebase-hosting-merge.yml` i bolag-ops om varför en PAT togs
# bort där.
name: Publish

# ══ ⛔ TVÅ VÄGAR IN, OCH DEN ANDRA FINNS AV ETT MÄTT SKÄL ═══════════════
#
# Taggvägen är den ursprungliga: någon med en terminal kör `git tag v0.23.1 &&
# git push --tags`, och jobbet ger ut.
#
# ⛔ DEN VÄGEN FÖRUTSÄTTER EN TERMINAL, OCH DEN 2026-09-27 FANNS INGEN. Ramverkets
# main stod på 0.23.0 medan senaste taggen var v0.22.0, alltså var versionen
# aldrig utgiven, och appen låg kvar på v0.21.0 med en reglagefix som var byggd,
# mergad och inte live.
#
# ⛔ OCH FRÅN WEBBEN GÅR DET INTE ATT SKAPA BARA EN TAGG. GitHubs gränssnitt
# skapar en tagg genom att skapa en RELEASE, och då faller det här jobbet på
# `gh release create`: releasen finns redan. Den fällan är precis den sortens
# sak som får någon att tro att utgivningen är trasig.
#
# Därför den här knappen. Den tar ingen indata alls: versionen läses ur
# `package.json`, alltså ur den enda källa som ändå måste stämma.
on:
  push:
    tags:
      # ⛔ Bara semver. En tagg som heter `v1` eller `release-3` ska inte ge ut
      # något, eftersom versionen härleds ur taggnamnet och måste gå att jämföra.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# ⛔ `contents: write` KRÄVS för att skapa en release. Standard
# för en tokenrättighet är att lista exakt det som behövs: en `write-all` här
# hade gett jobbet rätt att skriva i repot, och det ska det inte ha.
# ⛔ OCH TVÅ LÄSRÄTTIGHETER (2026-11-09, granskningen av b6679ef): steget `provad` frågar vilken PR commiten kom från
# (`pull-requests: read`) och vilka kontroller som var gröna där (`checks: read`). Utan dem nekas frågan, steget faller
# tillbaka på hela sviten och besparingen blir noll utan att något syns. Båda är läsning och ger inget att skriva med.
permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # ⛔ TAGGARNA BEHÖVS (0.82.0, granskningen av PR 314). `check-changelog-taggar` kräver en rubrik i CHANGELOG
        # för varje publicerad tagg, och utan taggar läser den noll och blir röd på sitt golv i stället för grön på tomt.
        with:
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # ⛔ VILKEN TAGG DET GÄLLER AVGÖRS HÄR, EN GÅNG, och båda vägarna landar i
      # samma variabel. Räknades den ut på två ställen vore det två sanningar om
      # vad som ges ut.
      #
      # ⛔ PÅ TAGGVÄGEN MÅSTE TAGGEN OCH `package.json` SÄGA SAMMA SAK. En tagg
      # som pekar på en annan version än paketet bär ger en release vars filnamn
      # och vars innehåll inte stämmer överens, och det felet upptäcks av den som
      # installerar. På knappvägen kan de inte glida isär: taggen HÄRLEDS ur
      # versionen, så kontrollen är sann av konstruktion och står kvar ändå.
      #
      # ⛔ TAGGNAMNET GÅR VIA `env` OCH INTERPOLERAS ALDRIG I SKALET. Ett
      # taggnamn är indata, och indata i ett `run`-block är en väg in i körningen.
      - name: Vilken tagg, och att den matchar versionen
        id: taggen
        env:
          REF_NAMN: ${{ github.ref_name }}
          HANDELSE: ${{ github.event_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$HANDELSE" = "workflow_dispatch" ]; then
            TAGG="v$VERSION"
            echo "Knappvägen: taggen härleds ur package.json till $TAGG"
          else
            TAGG="$REF_NAMN"
          fi
          if [ "$TAGG" != "v$VERSION" ]; then
            echo "Taggen är '$TAGG' men package.json säger '$VERSION'. Utgivningen stoppas." >&2
            exit 1
          fi
          echo "Taggen och versionen är överens: $TAGG"
          echo "tagg=$TAGG" >> "$GITHUB_OUTPUT"

      # ⛔ KONTROLLEN STÅR FÖRE GRINDEN OCH INTE EFTER. Hela kedjan tar minuter,
      # och att falla på "releasen finns redan" EFTER dem är en körning som
      # kostat allt och sagt ingenting. En redan utgiven version är dessutom det
      # normala misstaget på knappvägen: man trycker en gång till.
      - name: Versionen är inte redan utgiven
        env:
          GH_TOKEN: ${{ github.token }}
          TAGG: ${{ steps.taggen.outputs.tagg }}
        run: |
          if gh release view "$TAGG" >/dev/null 2>&1; then
            echo "Releasen $TAGG finns redan. Höj versionen i package.json och skriv ett avsnitt i CHANGELOG.md först." >&2
            exit 1
          fi
          echo "$TAGG är inte utgiven än."

      # ⛔ SVITEN KÖRS EN GÅNG PER ÄNDRING, INTE TVÅ (CP 2026-11-09: "Du använder slut på mina github action minuter på en dag.
      # Inte ok. Vi behöver en annan process"). Här kördes hela `check` och scaffold-vakterna igen, cirka 25 minuter, på samma
      # kod som just varit grön på PR:en, och `check.yml` körde den en gång till på main. Nu frågar steget GitHub vilken PR
      # commiten kom från och hoppar över sviten bara när ALLT gäller: PR:ens head har gröna `check`, `scaffold` (där skalyta,
      # brand och typografi körs), `paket` och `regelprov`, och commitens träd är byte för byte PR-headens. Annars körs hela
      # sviten här som förut, också när något inte går att fråga om. Grinden före utgivningen och lärdomen om skalytevakten
      # nedan står alltså kvar: ingen release går ut utan att exakt den koden passerat hela grinden någonstans.
      - name: Var exakt det här trädet redan grönt på PR:en?
        id: provad
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          kor() { echo "Hela sviten körs: $1"; echo "kor=ja" >> "$GITHUB_OUTPUT"; exit 0; }
          # ⛔ BARA MAIN, OCH BARA EN COMMIT SOM ÄR PR:ENS EGEN MERGE (granskningen av b6679ef). Kontrollerna på en PR-head provar
          # headen PLUS basen när de kördes, inte headens eget träd. En tagg på en äldre PR-head, eller knappen från en annan gren,
          # hade kunnat ge ut ett träd som aldrig provats som det ser ut. Därför krävs att det är main och att commiten är PR:ens
          # merge-commit; annars körs hela sviten.
          [ "$GITHUB_REF" = "refs/heads/main" ] || kor "körningen gäller $GITHUB_REF och inte main"
          HEAD="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")][0].head.sha" 2>/dev/null)" || kor "frågan om PR:en gick inte att ställa"
          [ -n "$HEAD" ] && [ "$HEAD" != "null" ] || kor "commiten $SHA är inte merge-commiten för en mergad PR"
          TRAD="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)" || kor "trädet för $SHA gick inte att läsa"
          PRTRAD="$(gh api "repos/$REPO/git/commits/$HEAD" --jq .tree.sha)" || kor "trädet för PR-headen $HEAD gick inte att läsa"
          [ "$TRAD" = "$PRTRAD" ] || kor "trädet skiljer sig från PR-headen $HEAD (main hade ändrats sedan PR:en provades)"
          for JOBB in check scaffold paket regelprov; do
            UTFALL="$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$JOBB\" and .app.slug == \"github-actions\")] | sort_by(.completed_at) | last | .conclusion")" || kor "utfallet för $JOBB gick inte att läsa"
            [ "$UTFALL" = "success" ] || kor "$JOBB på PR-headen $HEAD är '$UTFALL', inte success"
          done
          echo "Sviten hoppas över: trädet $TRAD är PR-headens $HEAD, och check, scaffold, paket och regelprov var gröna där."
          echo "kor=nej" >> "$GITHUB_OUTPUT"

      # ⛔ HELA GRINDEN FÖRE UTGIVNINGEN, inte bara proven. En tagg är
      # oföränderlig i praktiken: den som installerat den har den, och en
      # tillbakadragen version är värre än en som aldrig fanns.
      - if: steps.provad.outputs.kor != 'nej'
        run: npm run check
      # Paketet byggs ur dist också när sviten hoppas över.
      - if: steps.provad.outputs.kor == 'nej'
        run: npm run build

      # ⛔ Och vakten som packar och installerar på riktigt. Den är det enda
      # steget som bevisar att just den tarboll som läggs upp går att använda.
      - run: npm run check:paket

      # ⛔ SKALYTEVAKTEN SAKNADES HÄR, OCH DET KOSTADE SJU RELEASER. `check.yml` kör
      # `check:skalyta` i jobbet `scaffold`, men utgivningen körde bara `check` och
      # `check:paket`. Skalytevakten var röd från 0.90.4 till 0.91.0 och sju versioner
      # gick ut ändå, eftersom den enda grind som står mellan en tagg och en release
      # är den här filen. Den mäter CSS i en riktig webbläsare, alltså sådant som
      # jsdom aldrig ser. Samma installation som i `check.yml`: bara chromium, och
      # `npm run check` har redan byggt `dist`, som vakten kräver.
      - if: steps.provad.outputs.kor != 'nej'
        run: npx playwright install --with-deps chromium
      - if: steps.provad.outputs.kor != 'nej'
        run: npm run check:skalyta
      # 0.94.0: brandfilen och lagren, samma skäl och samma installation som skalytevakten ovan.
      - if: steps.provad.outputs.kor != 'nej'
        run: npm run check:brand
      # 0.136.0: typografin ritad mot SessionStudio, samma skäl och samma installation som ovan.
      - if: steps.provad.outputs.kor != 'nej'
        run: npm run check:typografimatning

      - name: Packa
        id: packa
        run: |
          mkdir -p utgiven
          npm pack --pack-destination utgiven
          echo "fil=$(ls utgiven/*.tgz)" >> "$GITHUB_OUTPUT"

      # ⛔ Anteckningarna hämtas ur CHANGELOG.md och skrivs inte i jobbet. Två
      # ställen som beskriver samma version glider isär, och det är alltid
      # releasetexten som blir den som ljuger, eftersom ingen läser om den.
      - name: Avsnittet ur ändringsloggen
        env:
          VERSION_RUBRIK: ${{ steps.taggen.outputs.tagg }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = String(process.env.VERSION_RUBRIK || "").replace(/^v/, "");
            const logg = fs.readFileSync("CHANGELOG.md", "utf8");
            const rader = logg.split("\n");
            const start = rader.findIndex((r) => r.trim() === `## ${version}`);
            if (start < 0) { console.error(`CHANGELOG.md saknar "## ${version}"`); process.exit(1); }
            const slut = rader.findIndex((r, i) => i > start && /^## /.test(r));
            const avsnitt = rader.slice(start + 1, slut < 0 ? rader.length : slut).join("\n").trim();
            fs.writeFileSync("release-text.md", `${avsnitt}\n`);
          '
          cat release-text.md

      # ⛔ `gh release create` OCH INTE EN TREDJEPARTSACTION. En action som får
      # `contents: write` på ett repo är en leverantörskedja till, och `gh` finns
      # redan på körarna.
      - name: Skapa releasen
        env:
          GH_TOKEN: ${{ github.token }}
          TAGG: ${{ steps.taggen.outputs.tagg }}
          TARBOLL: ${{ steps.packa.outputs.fil }}
          SHA: ${{ github.sha }}
        # ⛔ `--target` SÄTTS MED FLIT. På taggvägen pekar taggen redan på ett
        # commit och flaggan är en upprepning. På knappvägen FINNS ingen tagg än,
        # och `gh release create` skapar den: utan `--target` gissar den på
        # standardgrenens spets, alltså möjligen ett annat commit än det som just
        # provats och packats.
        run: gh release create "$TAGG" "$TARBOLL" --target "$SHA" --title "$TAGG" --notes-file release-text.md
