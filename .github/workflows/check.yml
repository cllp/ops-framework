# Ramverkets egen grind.
#
# ⛔ DEN HÄR SAKNADES HELT, OCH LUCKAN VAR INTE UPPENBAR.
#
# Konsumentapparna pinnar ramverket per SHA och har en egen vakt (`check-pin`)
# som ser till att pinnen är äkta och installerad. Det ser ut som ett skydd, och
# det är det: mot FEL VERSION. Det säger ingenting om att versionen FUNGERAR.
#
# Följden var att varje "grönt" på en framework-PR bara var ett påstående från
# den maskin som råkade köra `npm run check`. Ingen körning på GitHub bekräftade
# det, och en trasig commit på main hade upptäckts först när en app repinnade,
# alltså långt ifrån sin orsak och av fel person.
#
# ⛔ Appens kedja räddar oss inte. `web/npm run check` kör APPENS tester, inte
# ramverkets. De 247 proven och de 38 vaktreglerna körs ingen annanstans.
#
# `npm run check` är avsiktligt hela kedjan och inte bara `npm test`: bygget,
# typerna, tokens, exportytan, README-täckningen, det stängda API:et, datalagret,
# CSS-bygget, typsnittet, diagramfärgerna och vaktproven. Att plocka ut en bit av
# den här hade gjort grinden billigare än den lokala, alltså en grind som säger ja
# till sådant utvecklaren själv hade fått nej på.
name: Check

on:
  push:
    branches: [main]
  # ⛔ INGEN `branches`-FILTER PÅ PR, OCH DET ÄR MÄTT 2026-09-27.
  #
  # Här stod `branches: [main]`. Följden var att en PR mot en ANNAN gren fick
  # NOLL check runs, tyst. Fas 2.5 byggdes som tre PR:ar ovanpå #136:s gren, och
  # alla tre stod i timmar utan en enda kontroll. Ingenting var rött, ingenting
  # var grönt, och det gick bara att se genom att fråga efter check runs och få
  # en tom lista tillbaka. Det är arbetsreglernas punkt 5 i sin värsta form: en
  # utelämnad rubrik som inte går att skilja från ett svar.
  #
  # ⛔ OCH ATT BYTA BAS I EFTERHAND RÄDDAR INGET. GitHub skickar `edited` när
  # basen ändras, och en workflow lyssnar på `opened`, `synchronize` och
  # `reopened`. Grenen måste alltså få en ny commit för att bli kontrollerad,
  # vilket är ett ohyggligt dåligt sätt att upptäcka att man inte var det.
  #
  # ⛔ FILTRET SKYDDADE INGENTING. Varje PR i repot vill ha kedjan körd: en PR
  # mot en annan gren är lika mycket kod som en mot main, och den mergas
  # dessutom vidare till main sedan. Kostnaden är oförändrad, eftersom antalet
  # PR:ar är detsamma.
  pull_request:
  # ⛔ OCH EN KNAPP, så kedjan går att köra mot en gren utan att först skriva en
  # commit ingen bad om. Den är svaret på exakt den situation som uppstod ovan:
  # tre grenar som behövde kontrolleras och inte hade något att pusha.
  workflow_dispatch:

# ⛔ EN KÖRNING PER GREN, INTE EN PER PUSH.
#
# CP 2026-09-19: "Minimera nu antalet PR. GitHub-minuterna börjar gå i taket."
# Mätt i bolag-ops samma natt: 40 körningar och 38,3 minuter på 6,5 timmar. En
# ramverks-PR kostar cirka 3,8 minuter, eftersom `check` och `scaffold` kör både
# på grenen och på main efter mergen.
#
# Pushar jag två gånger till samma gren, vilket händer varje gång en vakt hittar
# något i mitt eget arbete, betalar vi för den första körningen fram till att den
# blivit meningslös. Med gruppen avbryts den i samma sekund den andra startar.
#
# ⛔ `github.ref` OCH INTE GRENNAMNET: en PR och en push till main måste hamna i
# olika grupper, annars avbryter mergen den körning som just då avgör om mergen
# var rätt.
#
# ⛔ MAIN AVBRYTS ALDRIG, och det är hela poängen med villkoret. En avbruten
# körning på main lämnar ingen uppgift om huruvida main är grön, och nästa app
# som pinnar om gör det mot ett okänt läge.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      # ⛔ `npm ci` och inte `npm install`. Den senare får uppdatera lockfilen,
      # och då kan grinden köra mot andra versioner än utvecklaren gjorde. En
      # grön körning mot en annan uppsättning beroenden bevisar fel sak.
      - run: npm ci
      - run: npm run check

  # ⛔ DEN ENDA VAKT SOM SER CSS KÖRDES ALDRIG AV NÅGON MASKIN, OCH DET ÄR MÄTT.
  #
  # `check-scaffold` bär hela mobilgolvet: den är det enda stället i huset där CSS
  # faktiskt körs, eftersom alla andra prov lever i jsdom som inte har någon
  # layoutmotor. Ändå låg den utanför `npm run check` och alltså utanför jobbet
  # ovan. Den fanns bara i `check:all`, och `check:all` nämndes på exakt två
  # ställen i hela repot: i `package.json` och i README som ett kommando en
  # människa kan skriva.
  #
  # Följden var att mobilgolvet mättes när någon kom ihåg det. Det är samma
  # felklass som allt annat den här vakten finns för att fånga: en kontroll som
  # inte körs ser exakt ut som en som passerar.
  #
  # ⛔ EGET JOBB OCH INTE ETT STEG I DET OVAN. Den installerar en webbläsare,
  # scaffoldar en app och kör `npm install` i den, alltså flera minuter. Som ett
  # steg hade den fördröjt varje svar på typfel och tokenbrott; som eget jobb kör
  # den parallellt och kostar bara sin egen väggtid.
  #
  # ⛔ ATT DEN GÅR ATT KÖRA HÄR ÄR INTE GRATIS ÖVERALLT. Det här repot är publikt,
  # alltså fria Actions-minuter. Samma mätning i en privat konsumentapp debiteras.
  # Dyr verifiering hör därför hemma här, och det är motsatsen till var den låg.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # ⛔ Bara chromium och bara dess systemberoenden. Tre webbläsare hade tagit
      # tre gånger tiden för samma svar: mätningen körs i en av dem.
      - run: npx playwright install --with-deps chromium
      # ⛔ Provaren FÖRE vakten den provar. Är mätningen trasig är ett grönt
      # `check-scaffold` inte ett bevis, och då vill jag veta det först.
      - run: npm run check:viewport-guard
      - run: npm run check:scaffold
      # ⛔ Skalets yta (0.30.0, #173) är också CSS som ingen jsdom-svit ser: en linje för mycket i menyn, en knapp som
      # sitter en pixel för högt, en inställningsvy som flödar ut vid 390 px. Kräver en byggd `dist` och en webbläsare,
      # alltså hör den hemma här och inte i `check`.
      - run: npm run build
      - run: npm run check:skalyta

  # ⛔ PACKNINGEN MÅSTE PROVAS PÅ VARJE PR, INTE FÖRST VID TAGGEN.
  #
  # Utgivningen (`publish.yml`) kör samma vakt, men då är taggen redan satt och
  # en tagg är oföränderlig i praktiken: den som hunnit installera den har den.
  # Ett paket som saknar en fil eller drar in en devDependency ska bli rött
  # medan det fortfarande är en gren.
  #
  # ⛔ EGET JOBB, av samma skäl som scaffold: den packar, installerar i ett tomt
  # projekt och importerar. Som ett steg i `check` hade den fördröjt varje svar
  # på typfel.
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:paket

  # ⛔ REGELPROVEN I ETT EGET JOBB, AV SAMMA SKÄL SOM SCAFFOLD OCH PAKET (#136).
  #
  # De startar Firestore-emulatorn, alltså en Java-process och en nedladdning,
  # och kör 31 prov mot den. Som ett steg i `check` hade varje typfel fått vänta
  # på det; som eget jobb kostar de bara sin egen väggtid.
  #
  # ⛔ OCH DE PROVAR GENERERAD TEXT, INTE EN INCHECKAD KOPIA.
  # `rules/provregler.rules` skrivs av `skriv-provregler` ur `regelfragment()`
  # strax innan emulatorn startar, och filen är git-ignorerad. Provas en
  # handskriven kopia bevisar proven att någon skrev rätt en gång, inte att
  # generatorn gör det.
  #
  # ⛔ JAVA KRÄVS, och det står här eftersom felet annars är kryptiskt:
  # emulatorn dör med ett meddelande om en saknad körning och inte om Java.
  regelprov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      # ⛔ JAVA KONTROLLERAS FÖRST, OCH DET ÄR INTE ÖVERFLÖDIGT. Emulatorn är
      # en jar. Saknas Java faller den med ett meddelande om emulatorn, alltså
      # långt ifrån orsaken, och nästa person felsöker reglerna. Ubuntu-köraren
      # har Java förinstallerat; skulle den sluta ha det vill jag se det på
      # raden som heter Java. Samma steg och samma skäl som i bolag-ops.
      - name: Java finns
        run: java -version
      - run: npm ci
      - run: npm run test:rules
